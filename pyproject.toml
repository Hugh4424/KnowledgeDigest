[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-digest"
version = "0.1.0"
description = "Local knowledge digest command-line tool"
requires-python = ">=3.11"
dependencies = ["PyYAML==6.0.2"]

[project.scripts]
digest = "knowledge_digest.simple_cli:main"
knowledge-digest-calibrate = "knowledge_digest.calibration_cli:main"
knowledge-digest-publish = "knowledge_digest.kb_publish:main"
knowledge-digest-rollback = "knowledge_digest.kb_publish:main"
knowledge-digest-accept = "knowledge_digest.kb_accept:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
